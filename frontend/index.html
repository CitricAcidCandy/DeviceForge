<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeviceForge · 设备工坊</title>
    <!--
      插件包自带 React 会得到第二份实例：hooks 与 context 全部失效。
      各说明符使用独立生成入口，导出其对应模块的完整公开 API；
      它们只读取宿主全局契约，不内联 React。插件构建时保留这些裸模块名。
      importmap 必须出现在任何 module script 之前。
    -->
    <script type="importmap">
      {
        "imports": {
          "deviceforge-host": "/plugin-host.js",
          "react": "/plugin-react.js",
          "react/jsx-runtime": "/plugin-jsx-runtime.js",
          "react/jsx-dev-runtime": "/plugin-jsx-dev-runtime.js",
          "react-dom": "/plugin-react-dom.js",
          "react-dom/client": "/plugin-react-dom-client.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
