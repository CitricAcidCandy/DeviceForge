te(32 286)"><rect width="600" height="1" rx="0" fill="#E6EBF2"/></g><g id="正常_文档脚注" inkscape:groupmode="layer" inkscape:label="文档说明图层" transform="translate(32 306)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">设备状态与采集记录，集中在一处查看</tspan></text></g></g><g id="正常_选中角0" inkscape:groupmode="layer" inkscape:label="选中边界控制点（示意）" transform="translate(109 207)"><rect width="6" height="6" rx="1" fill="#FFFFFF" stroke="#6C4CF5" stroke-width="1"/></g><g id="正常_选中角1" inkscape:groupmode="layer" inkscape:label="选中边界控制点（示意）" transform="translate(401 207)"><rect width="6" height="6" rx="1" fill="#FFFFFF" stroke="#6C4CF5" stroke-width="1"/></g><g id="正常_选中角2" inkscape:groupmode="layer" inkscape:label="选中边界控制点（示意）" transform="translate(109 347)"><rect width="6" height="6" rx="1" fill="#FFFFFF" stroke="#6C4CF5" stroke-width="1"/></g><g id="正常_选中角3" inkscape:groupmode="layer" inkscape:label="选中边界控制点（示意）" transform="translate(401 347)"><rect width="6" height="6" rx="1" fill="#FFFFFF" stroke="#6C4CF5" stroke-width="1"/></g><g id="正常_选择名" inkscape:groupmode="layer" inkscape:label="示例选中内容说明（非原生工具栏）" transform="translate(80 62)"><text fill="#6B4CF5" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400"><tspan x="0" y="11.9">示例文档 · 在线设备卡片已选中</tspan></text></g><g id="正常_示例声明" inkscape:groupmode="layer" inkscape:label="示例内容边界" transform="translate(80 470)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">示例文档图层 · 非真实编辑器截图</tspan></text></g></g><g id="正常_底栏" inkscape:groupmode="layer" inkscape:label="右栏底部状态" transform="translate(20 688)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400"><tspan x="0" y="11.9">当前选择：在线设备 / 卡片 · 在原生画布直接编辑</tspan></text></g></g></g></svg>
