<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1424" height="805" viewBox="0 0 1424 805"><title>01｜正常分屏｜图层画布</title><desc>分层可编辑 SVG；不是 Ardot 原生导出；不含位图截图或生图。</desc><g id="正常_屏幕" inkscape:groupmode="layer" inkscape:label="01｜正常分屏｜图层画布" transform="translate(0 0)"><rect width="1424" height="805" rx="0" fill="#F7F7FA"/><g id="正常_顶栏" inkscape:groupmode="layer" inkscape:label="DSH 宿主顶栏（上下文示意）" transform="translate(0 0)"><rect width="1424" height="52" rx="0" fill="#FFFFFF"/><g id="正常_品牌" inkscape:groupmode="layer" inkscape:label="DSH 标识" transform="translate(24 13)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700"><tspan x="0" y="18.2">DSH</tspan></text></g><g id="正常_路径" inkscape:groupmode="layer" inkscape:label="设计会话路径" transform="translate(88 15)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400"><tspan x="0" y="13.700000000000001">设计会话  /  设备工作台</tspan></text></g><g id="正常_MCP状态" inkscape:groupmode="layer" inkscape:label="MCP 连接状态（与嵌入状态分开）" transform="translate(1260 13)"><rect width="140" height="28" rx="14" fill="#F5F2FF"/><g id="正常_连接点" inkscape:groupmode="layer" inkscape:label="已连接状态点" transform="translate(12 10)"><ellipse cx="3.5" cy="3.5" rx="3.5" ry="3.5" fill="#6B4CF5"/></g><g id="正常_连接文案" inkscape:groupmode="layer" inkscape:label="MCP 已连接" transform="translate(28 3)"><text fill="#6B4CF5" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">MCP 已连接</tspan></text></g></g></g><g id="正常_对话" inkscape:groupmode="layer" inkscape:label="DSH 左侧对话（原宿主边界）" transform="translate(16 68)"><rect width="520" height="721" rx="12" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="正常_对话标记" inkscape:groupmode="layer" inkscape:label="对话区域标签" transform="translate(24 20)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">对话</tspan></text></g><g id="正常_会话标题" inkscape:groupmode="layer" inkscape:label="会话标题" transform="translate(24 48)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700"><tspan x="0" y="18.2">设备工作台设计</tspan></text></g><g id="正常_对话分隔" inkscape:groupmode="layer" inkscape:label="对话标题分隔线" transform="translate(24 92)"><rect width="472" height="1" rx="0" fill="#E6EBF2"/></g><g id="正常_用户标签" inkscape:groupmode="layer" inkscape:label="用户消息归属" transform="translate(24 112)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">你</tspan></text></g><g id="正常_用户消息" inkscape:groupmode="layer" inkscape:label="用户消息（示例）" transform="translate(24 142)"><rect width="472" height="78" rx="10" fill="#F7F7FA"/><g id="正常_用户正文" inkscape:groupmode="layer" inkscape:label="用户消息内容" transform="translate(16 14)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="0" y="14.6">把设备概览整理成两张卡片。</tspan><tspan x="0" y="36.6">保留右侧画布，我继续补充文案。</tspan></text></g></g><g id="正常_助手标签" inkscape:groupmode="layer" inkscape:label="助手消息归属" transform="translate(24 244)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700"><tspan x="0" y="12.8">DSH</tspan></text></g><g id="正常_助手正文" inkscape:groupmode="layer" inkscape:label="助手反馈（示例，不是运行证据）" transform="translate(24 276)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="0" y="14.6">右侧是同一个 Ardot 文件。</tspan><tspan x="0" y="36.6">你可以直接选中图层，也可以继续描述修改。</tspan></text></g><g id="正常_文件回执" inkscape:groupmode="layer" inkscape:label="文件引用回执（不另建对话内编辑器）" transform="translate(24 350)"><rect width="472" height="94" rx="10" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="正常_文件回执名" inkscape:groupmode="layer" inkscape:label="当前文件名" transform="translate(16 13)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700"><tspan x="0" y="14.6">设备概览 · 工作台</tspan></text></g><g id="正常_文件回执态" inkscape:groupmode="layer" inkscape:label="文件回执状态" transform="translate(16 46)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">已在右侧打开 · 图层可直接编辑</tspan></text></g></g><g id="正常_继续提示" inkscape:groupmode="layer" inkscape:label="不中断对话提示" transform="translate(24 474)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">继续对话，不必在聊天和设计之间来回切换。</tspan><tspan x="0" y="34.8">拖动中间分隔条，可调整画布宽度。</tspan></text></g><g id="正常_输入框" inkscape:groupmode="layer" inkscape:label="DSH 原有输入区（保持可用）" transform="translate(24 557)"><rect width="472" height="118" rx="10" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="正常_输入提示" inkscape:groupmode="layer" inkscape:label="输入区占位文案" transform="translate(16 14)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400"><tspan x="0" y="13.700000000000001">继续描述修改，或直接编辑右侧图层…</tspan></text></g><g id="正常_文件上下文" inkscape:groupmode="layer" inkscape:label="输入区文件上下文" transform="translate(16 76)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400"><tspan x="0" y="11.9">当前文件 · 设备概览</tspan></text></g><g id="正常_发送" inkscape:groupmode="layer" inkscape:label="发送" transform="translate(382 70)"><rect width="74" height="34" rx="7" fill="#6B4CF5"/><g id="正常_发送_文字" inkscape:groupmode="layer" inkscape:label="发送" transform="translate(0 0)"><text fill="#FFFFFF" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan x="37.0" y="21.5">发送</tspan></text></g></g></g><g id="正常_输入规则" inkscape:groupmode="layer" inkscape:label="输入快捷键提示" transform="translate(24 685)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400"><tspan x="0" y="11.9">Enter 发送 · Shift + Enter 换行</tspan></text></g></g><g id="正常_分隔手柄" inkscape:groupmode="layer" inkscape:label="可拖动分隔条（建议命中宽 16）" transform="translate(536 68)"><rect width="16" height="721" rx="0" fill="#F7F7FA"/><g id="正常_分隔轨道" inkscape:groupmode="layer" inkscape:label="分隔条可见轨道" transform="translate(7 0)"><rect width="1" height="721" rx="0" fill="#B5BFCF"/></g><g id="正常_分隔抓手" inkscape:groupmode="layer" inkscape:label="拖动抓手" transform="translate(5 328)"><rect width="5" height="44" rx="2" fill="#667085"/></g></g><g id="正常_右栏" inkscape:groupmode="layer" inkscape:label="DSH 右侧插件容器（仅宿主外壳）" transform="translate(552 68)"><rect width="856" height="721" rx="12" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="正常_右栏文件" inkscape:groupmode="layer" inkscape:label="右侧文件名" transform="translate(20 15)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700"><tspan x="0" y="16.4">设备概览 · 工作台</tspan></text></g><g id="正常_同步" inkscape:groupmode="layer" inkscape:label="同步状态（设计态示例）" transform="translate(20 45)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">已同步 · 修改保存在 Ardot 文件中</tspan></text></g><g id="正常_浏览器" inkscape:groupmode="layer" inkscape:label="在浏览器打开" transform="translate(616 21)"><rect width="130" height="34" rx="7" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="正常_浏览器_文字" inkscape:groupmode="layer" inkscape:label="在浏览器打开" transform="translate(0 0)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan x="65.0" y="21.5">在浏览器打开</tspan></text></g></g><g id="正常_关闭" inkscape:groupmode="layer" inkscape:label="关闭右栏" transform="translate(758 21)"><rect width="78" height="34" rx="7" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="正常_关闭_文字" inkscape:groupmode="layer" inkscape:label="关闭右栏" transform="translate(0 0)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan x="39.0" y="21.5">关闭右栏</tspan></text></g></g><g id="正常_原生边界" inkscape:groupmode="layer" inkscape:label="Ardot 原生嵌入边界（宿主不复制编辑器）" transform="translate(16 92)"><rect width="824" height="585" rx="8" fill="#F5F7FA" stroke="#E6EAF3" stroke-width="1"/><g id="正常_边界标记" inkscape:groupmode="layer" inkscape:label="原生嵌入边界标注" transform="translate(16 12)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">Ardot 原生画布 · 嵌入区域</tspan></text></g><g id="正常_边界说明" inkscape:groupmode="layer" inkscape:label="不臆造原生编辑器工具栏" transform="translate(16 550)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400"><tspan x="0" y="11.9">原生工具与图层交互由 Ardot 提供，此稿不重画编辑器按钮</tspan></text></g><g id="正常_文档图层" inkscape:groupmode="layer" inkscape:label="示例文档画板（不是宿主编辑器）" transform="translate(80 92)"><rect width="664" height="354" rx="2" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="正常_文档标题" inkscape:groupmode="layer" inkscape:label="设备概览 / 标题图层" transform="translate(32 28)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700"><tspan x="0" y="23.6">设备概览</tspan></text></g><g id="正常_文档描述" inkscape:groupmode="layer" inkscape:label="设备概览 / 描述图层" transform="translate(32 74)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400"><tspan x="0" y="13.700000000000001">连接设备，开始一次新的采集</tspan></text></g><g id="正常_设备卡片" inkscape:groupmode="layer" inkscape:label="在线设备 / 卡片容器（选中）" transfo