<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1424" height="805" viewBox="0 0 1424 805"><title>02｜嵌入失败｜对话保留</title><desc>分层可编辑 SVG；不是 Ardot 原生导出；不含位图截图或生图。</desc><g id="失败_屏幕" inkscape:groupmode="layer" inkscape:label="02｜嵌入失败｜对话保留" transform="translate(0 0)"><rect width="1424" height="805" rx="0" fill="#F7F7FA"/><g id="失败_顶栏" inkscape:groupmode="layer" inkscape:label="DSH 宿主顶栏（上下文示意）" transform="translate(0 0)"><rect width="1424" height="52" rx="0" fill="#FFFFFF"/><g id="失败_品牌" inkscape:groupmode="layer" inkscape:label="DSH 标识" transform="translate(24 13)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700"><tspan x="0" y="18.2">DSH</tspan></text></g><g id="失败_路径" inkscape:groupmode="layer" inkscape:label="设计会话路径" transform="translate(88 15)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400"><tspan x="0" y="13.700000000000001">设计会话  /  设备工作台</tspan></text></g><g id="失败_MCP状态" inkscape:groupmode="layer" inkscape:label="MCP 连接状态（与嵌入状态分开）" transform="translate(1260 13)"><rect width="140" height="28" rx="14" fill="#F5F2FF"/><g id="失败_连接点" inkscape:groupmode="layer" inkscape:label="已连接状态点" transform="translate(12 10)"><ellipse cx="3.5" cy="3.5" rx="3.5" ry="3.5" fill="#6B4CF5"/></g><g id="失败_连接文案" inkscape:groupmode="layer" inkscape:label="MCP 已连接" transform="translate(28 3)"><text fill="#6B4CF5" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">MCP 已连接</tspan></text></g></g></g><g id="失败_对话" inkscape:groupmode="layer" inkscape:label="DSH 左侧对话（原宿主边界）" transform="translate(16 68)"><rect width="520" height="721" rx="12" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="失败_对话标记" inkscape:groupmode="layer" inkscape:label="对话区域标签" transform="translate(24 20)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">对话</tspan></text></g><g id="失败_会话标题" inkscape:groupmode="layer" inkscape:label="会话标题" transform="translate(24 48)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700"><tspan x="0" y="18.2">设备工作台设计</tspan></text></g><g id="失败_对话分隔" inkscape:groupmode="layer" inkscape:label="对话标题分隔线" transform="translate(24 92)"><rect width="472" height="1" rx="0" fill="#E6EBF2"/></g><g id="失败_用户标签" inkscape:groupmode="layer" inkscape:label="用户消息归属" transform="translate(24 112)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">你</tspan></text></g><g id="失败_用户消息" inkscape:groupmode="layer" inkscape:label="用户消息（示例）" transform="translate(24 142)"><rect width="472" height="78" rx="10" fill="#F7F7FA"/><g id="失败_用户正文" inkscape:groupmode="layer" inkscape:label="用户消息内容" transform="translate(16 14)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="0" y="14.6">把设备概览整理成两张卡片。</tspan><tspan x="0" y="36.6">保留右侧画布，我继续补充文案。</tspan></text></g></g><g id="失败_助手标签" inkscape:groupmode="layer" inkscape:label="助手消息归属" transform="translate(24 244)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700"><tspan x="0" y="12.8">DSH</tspan></text></g><g id="失败_助手正文" inkscape:groupmode="layer" inkscape:label="助手反馈（示例，不是运行证据）" transform="translate(24 276)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="0" y="14.6">右侧嵌入暂时失败，对话仍可继续。</tspan><tspan x="0" y="36.6">可以重试画布，或在浏览器打开同一文件。</tspan></text></g><g id="失败_文件回执" inkscape:groupmode="layer" inkscape:label="文件引用回执（不另建对话内编辑器）" transform="translate(24 350)"><rect width="472" height="94" rx="10" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="失败_文件回执名" inkscape:groupmode="layer" inkscape:label="当前文件名" transform="translate(16 13)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700"><tspan x="0" y="14.6">设备概览 · 工作台</tspan></text></g><g id="失败_文件回执态" inkscape:groupmode="layer" inkscape:label="文件回执状态" transform="translate(16 46)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">文件引用保留 · 右侧嵌入未完成</tspan></text></g></g><g id="失败_继续提示" inkscape:groupmode="layer" inkscape:label="不中断对话提示" transform="translate(24 474)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">不影响当前对话，你仍然可以继续发送消息。</tspan></text></g><g id="失败_输入框" inkscape:groupmode="layer" inkscape:label="DSH 原有输入区（保持可用）" transform="translate(24 557)"><rect width="472" height="118" rx="10" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="失败_输入提示" inkscape:groupmode="layer" inkscape:label="输入区占位文案" transform="translate(16 14)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400"><tspan x="0" y="13.700000000000001">继续描述修改，当前对话仍可发送…</tspan></text></g><g id="失败_文件上下文" inkscape:groupmode="layer" inkscape:label="输入区文件上下文" transform="translate(16 76)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400"><tspan x="0" y="11.9">当前文件 · 设备概览</tspan></text></g><g id="失败_发送" inkscape:groupmode="layer" inkscape:label="发送" transform="translate(382 70)"><rect width="74" height="34" rx="7" fill="#6B4CF5"/><g id="失败_发送_文字" inkscape:groupmode="layer" inkscape:label="发送" transform="translate(0 0)"><text fill="#FFFFFF" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan x="37.0" y="21.5">发送</tspan></text></g></g></g><g id="失败_输入规则" inkscape:groupmode="layer" inkscape:label="输入快捷键提示" transform="translate(24 685)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400"><tspan x="0" y="11.9">Enter 发送 · Shift + Enter 换行</tspan></text></g></g><g id="失败_分隔手柄" inkscape:groupmode="layer" inkscape:label="可拖动分隔条（建议命中宽 16）" transform="translate(536 68)"><rect width="16" height="721" rx="0" fill="#F7F7FA"/><g id="失败_分隔轨道" inkscape:groupmode="layer" inkscape:label="分隔条可见轨道" transform="translate(7 0)"><rect width="1" height="721" rx="0" fill="#B5BFCF"/></g><g id="失败_分隔抓手" inkscape:groupmode="layer" inkscape:label="拖动抓手" transform="translate(5 328)"><rect width="5" height="44" rx="2" fill="#667085"/></g></g><g id="失败_右栏" inkscape:groupmode="layer" inkscape:label="DSH 右侧插件容器（仅宿主外壳）" transform="translate(552 68)"><rect width="856" height="721" rx="12" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="失败_右栏文件" inkscape:groupmode="layer" inkscape:label="右侧文件名" transform="translate(20 15)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700"><tspan x="0" y="16.4">设备概览 · 工作台</tspan></text></g><g id="失败_同步" inkscape:groupmode="layer" inkscape:label="同步状态（设计态示例）" transform="translate(20 45)"><text fill="#94631F" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">嵌入失败 · 同步状态待确认</tspan></text></g><g id="失败_浏览器" inkscape:groupmode="layer" inkscape:label="在浏览器打开" transform="translate(616 21)"><rect width="130" height="34" rx="7" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="失败_浏览器_文字" inkscape:groupmode="layer" inkscape:label="在浏览器打开" transform="translate(0 0)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan x="65.0" y="21.5">在浏览器打开</tspan></text></g></g><g id="失败_关闭" inkscape:groupmode="layer" inkscape:label="关闭右栏" transform="translate(758 21)"><rect width="78" height="34" rx="7" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="失败_关闭_文字" inkscape:groupmode="layer" inkscape:label="关闭右栏" transform="translate(0 0)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan x="39.0" y="21.5">关闭右栏</tspan></text></g></g><g id="失败_原生边界" inkscape:groupmode="layer" inkscape:label="Ardot 原生嵌入边界（宿主不复制编辑器）" transform="translate(16 92)"><rect width="824" height="585" rx="8" fill="#F5F7FA" stroke="#E6EAF3" stroke-width="1"/><g id="失败_边界标记" inkscape:groupmode="layer" inkscape:label="原生嵌入边界标注" transform="translate(16 12)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">Ardot 原生画布 · 嵌入区域</tspan></text></g><g id="失败_边界说明" inkscape:groupmode="layer" inkscape:label="不臆造原生编辑器工具栏" transform="translate(16 550)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400"><tspan x="0" y="11.9">原生工具与图层交互由 Ardot 提供，此稿不重画编辑器按钮</tspan></text></g><g id="失败_错误卡片" inkscape:groupmode="layer" inkscape:label="嵌入失败反馈（不要求授权）" transform="translate(144 145)"><rect width="536" height="284" rx="12" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="失败_错误标题" inkscape:groupmode="layer" inkscape:label="清楚的失败原因标题" transform="translate(28 26)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700"><tspan x="0" y="20.0">画布暂时无法嵌入</tspan></text></g><g id="失败_错误正文" inkscape:groupmode="layer" inkscape:label="错误范围说明" transform="translate(28 76)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="400"><tspan x="0" y="13.700000000000001">Ardot MCP 仍已连接，当前文件未能在右侧加载。</tspan><tspan x="0" y="35.7">对话和输入不受影响，可以重试或在浏览器打开。</tspan></text></g><g id="失败_错误详情底" inkscape:groupmode="layer" inkscape:label="失败阶段详情底色" transform="translate(28 145)"><rect width="480" height="32" rx="6" fill="#FAF7F5"/><g id="失败_错误详情" inkscape:groupmode="layer" inkscape:label="嵌入与同步独立反馈" transform="translate(12 5)"><text fill="#94631F" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400"><tspan x="0" y="12.8">失败阶段：画布嵌入 · 同步状态待确认</tspan></text></g></g><g id="失败_重试" inkscape:groupmode="layer" inkscape:label="重试加载" transform="translate(28 197)"><rect width="112" height="34" rx="7" fill="#6B4CF5"/><g id="失败_重试_文字" inkscape:groupmode="layer" inkscape:label="重试加载" transform="translate(0 0)"><text fill="#FFFFFF" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan x="56.0" y="21.5">重试加载</tspan></text></g></g><g id="失败_错误浏览器" inkscape:groupmode="layer" inkscape:label="在浏览器打开" transform="translate(152 197)"><rect width="138" height="34" rx="7" fill="#FFFFFF" stroke="#E6EAF3" stroke-width="1"/><g id="失败_错误浏览器_文字" inkscape:groupmode="layer" inkscape:label="在浏览器打开" transform="translate(0 0)"><text fill="#262936" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" text-anchor="middle"><tspan x="69.0" y="21.5">在浏览器打开</tspan></text></g></g><g id="失败_重试范围" inkscape:groupmode="layer" inkscape:label="防止重复副作用提示" transform="translate(28 245)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400"><tspan x="0" y="11.9">重试不重新提交对话，也不创建新文件。</tspan></text></g></g></g><g id="失败_底栏" inkscape:groupmode="layer" inkscape:label="右栏底部状态" transform="translate(20 688)"><text fill="#667085" font-family="Sarasa Gothic SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400"><tspan x="0" y="11.9">对话可继续 · 重试仅恢复当前画布</tspan></text></g></g></g></svg>
