[package]
name = "deviceforge-resource-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
apk-domain = { path = "../backend/crates/domain" }
deviceforge-plugin-dependencies = { path = "../backend/crates/plugin-dependencies" }
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
percent-encoding = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# 独立资源服务不继承后端工作区配置，需单独限制日常编译占用。
[profile.dev]
debug = 0
incremental = false
codegen-units = 16

[profile.test]
debug = 0
incremental = false
codegen-units = 16
