[workspace]
members = ["crates/domain", "crates/plugin-sdk", "crates/plugin-dependencies", "crates/infrastructure", "crates/application", "crates/server", "plugins/echo", "plugins/artifact-copy", "plugins/performance-demo", "crates/data-codec", "plugins/msgpack", "crates/observability", "crates/plugin-runtime", "plugins/cooperative-demo", "crates/tool-process", "crates/tool-repository", "crates/android-package-core", "plugins/android-packages", "plugins/android-device", "plugins/harmony-device", "plugins/settings", "plugins/automation", "plugins/ai-assistant", "plugins/mirroring", "plugins/frida", "plugins/tool-supply", "plugins/terminal", "plugins/dex-analysis", "plugins/ai-sdk", "plugins/marketplace"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
uuid = { version = "1", features = ["v4", "serde"] }
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
deviceforge-observability = { path = "crates/observability" }
rusqlite = { version = "0.37", features = ["bundled"] }
futures-util = "0.3"
apk-domain = { path = "crates/domain" }
apk-plugin-sdk = { path = "crates/plugin-sdk" }
deviceforge-plugin-runtime = { path = "crates/plugin-runtime" }
deviceforge-tool-process = { path = "crates/tool-process" }
deviceforge-tool-repository = { path = "crates/tool-repository" }
deviceforge-plugin-dependencies = { path = "crates/plugin-dependencies" }
deviceforge-android-package-core = { path = "crates/android-package-core" }
apk-infrastructure = { path = "crates/infrastructure" }
apk-application = { path = "crates/application" }




deviceforge-data-codec = { path = "crates/data-codec" }

# 日常开发与测试优先节省磁盘，不保留完整调试信息或增量编译缓存。
[profile.dev]
debug = 0
incremental = false
codegen-units = 16

[profile.test]
debug = 0
incremental = false
codegen-units = 16
