[package]
name = "deviceforge-ai-sdk-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apk-plugin-sdk.workspace = true
deviceforge-plugin-runtime.workspace = true
deviceforge-tool-process.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
fs2 = "=0.4.3"
tempfile = "3"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_IO"] }
