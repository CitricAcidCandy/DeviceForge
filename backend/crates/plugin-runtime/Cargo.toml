[package]
name = "deviceforge-plugin-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
apk-plugin-sdk.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
