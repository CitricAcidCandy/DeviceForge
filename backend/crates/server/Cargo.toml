[package]
name = "apk-server"
default-run = "apk-server"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
apk-domain.workspace = true
apk-application.workspace = true
apk-infrastructure.workspace = true
apk-plugin-sdk.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
deviceforge-observability.workspace = true
uuid.workspace = true
schemars = "1"
[dev-dependencies]
async-trait.workspace = true
tokio-util.workspace = true
tower.workspace = true

[dependencies.rmcp]
version = "3.5.1"
features = ["transport-streamable-http-server", "schemars"]


[dependencies.futures-util]
workspace = true
[dependencies.percent-encoding]
version = "2"
[dev-dependencies.tempfile]
version = "3"

[dev-dependencies.zip]
version = "8.6"
default-features = false
