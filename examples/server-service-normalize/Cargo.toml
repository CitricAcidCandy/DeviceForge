[package]
name = "deviceforge-service-normalize"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
apk-plugin-sdk = { path = "../../backend/crates/plugin-sdk" }
deviceforge-plugin-runtime = { path = "../../backend/crates/plugin-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "fs", "time"] }
